[package]
name = "hq"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.103"
thiserror = "2.0.18"
once_cell = "1.21.4"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["query"] }
clap = { version = "4.6.1", features = ["derive"] }
erased-serde = "0.4.10"
fastembed = "5.17.2"
async-stream = "0.3.6"
futures = "0.3.32"
futures-util = "0.3.32"
handlebars = "6.4.2"
http = "1.4.2"
itertools = "0.15.0"
orgize = "0.10.0-alpha.10"
regex = "1.12.4"
reqwest = { version = "0.13.4", features = ["json", "blocking", "stream", "query", "form"] }
rusqlite = { version = "0.32.1", features = ["bundled", "load_extension"] }
rustyline = "18.0.1"
serde = "1.0.228"
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sqlite-vec = "0.1.3"
tantivy = "0.26.1"
text-splitter = { version = "0.32.0", features = ["tiktoken-rs"] }
tiktoken-rs = "0.12.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "process", "io-std", "net", "signal", "sync"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-push = { version = "0.11.0", features = ["hyper-client"] }
winnow = "1.0.3"
zerocopy = "0.8.14"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.4", features = ["v4"] }
tokio-rusqlite = "0.6.0"
tokio-stream = "0.1.18"
htmd = "0.5.4"
libc = "0.2"

# Vendored bashkit deps (previously transitive via bashkit)
bitflags = "2"
num-traits = "0.2"
os_display = "0.1.3"
fancy-regex = "0.18"
hmac = "0.13"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
url = "2"
getrandom = "0.4"
bigdecimal = "0.4"
unit-prefix = "0.5"


[dev-dependencies]
serial_test = "3.5.0"
tower = { version = "0.5.3", features = ["util"] }
mockito = "1.7.2"
tempfile = "3.27.0"
