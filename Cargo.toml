[workspace]
members = ["crates/bash", "crates/api", "crates/cli"]
default-members = [".", "crates/bash", "crates/api", "crates/cli"]
resolver = "3"

[package]
name = "hq"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"

[dependencies]
hq-bash = { path = "crates/bash" }
anyhow = "1.0.103"
thiserror = "2.0.18"
once_cell = "1.21.4"
async-trait = "0.1.92"
clap = { version = "4.6.1", features = ["derive"] }
erased-serde = "0.4.10"
fastembed = "5.17.2"
async-stream = "0.3.6"
futures = "0.3.32"
futures-util = "0.3.32"
handlebars = "6.4.2"
http = "1.4.2"
itertools = "0.15.0"
orgize = "0.10.0-alpha.10"
regex = "1.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "blocking", "stream", "query", "form", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sqlite-vec = "0.1.3"
tantivy = "0.26.1"
text-splitter = { version = "0.32.0", features = ["tiktoken-rs"] }
tiktoken-rs = "0.12.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "fs", "net", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
web-push = { version = "0.11.0", features = ["hyper-client"] }
winnow = "1.0.3"
zerocopy = "0.8.14"
base64 = "0.22.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
chrono = { version = "0.4.45", features = ["serde"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.4", features = ["v4"] }
tokio-rusqlite = { version = "0.8.0", features = ["bundled", "load_extension"] }
htmd = "0.5.4"
libc = "0.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
terminal_size = "0.4.4"
unicode-width = "0.2.2"
wasmtime = { version = "50.0.0", features = ["winch"] }
wasmtime-wasi = "50.0.0"

[profile.release]
# Cross-crate LTO and single codegen unit for max optimization
lto = true
codegen-units = 1
# Strip debug symbols from the deployed binary
strip = true

[dev-dependencies]
hq-api = { path = "crates/api" }
hq-cli = { path = "crates/cli" }
axum = { version = "0.8.9", features = ["macros", "multipart"] }
serial_test = "3.5.0"
tower = { version = "0.5.3", features = ["util"] }
mockito = "1.7.2"
tempfile = "3.27.0"

