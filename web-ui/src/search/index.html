<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FAFBF8">
  <link href="/output.css" rel="stylesheet">
  <title>Search</title>
  <script src="/theme-init.js"></script>
  <script type="module" src="/components/index.js"></script>
</head>
<body class="bg-canvas text-ink">
  <hq-page-shell meta-title="Search" nav-rail="search" back-href="/" back-label="Home">
    <hq-card max-width="2xl">
      <div class="relative mb-4">
        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-muted">
          <hq-icon name="search" size="md"></hq-icon>
        </div>
        <input id="search" type="text" autofocus autocapitalize="none" autocomplete="off"
          class="h-12 w-full rounded-[12px] border border-line bg-mist pl-10 pr-4 text-ink placeholder:text-muted focus:ring-2 focus:ring-teal sm:text-sm"
          placeholder="Search...">
      </div>

      <hq-state-view id="search-view" state="empty">
        <div slot="empty">
          <hq-empty-state id="empty-state" icon="book" title="Search your notes">
            <div id="recent-searches" slot="content" class="text-left">
              <p class="mb-1 px-3 text-xs font-medium uppercase tracking-wide text-muted">Recent</p>
              <ul class="flex flex-col"></ul>
            </div>
          </hq-empty-state>
        </div>
        <div slot="error">
          <hq-empty-state icon="alert" title="Error searching">
            Something went wrong while searching. Please try again.
            <hq-button id="retry" slot="action" variant="secondary">Retry</hq-button>
          </hq-empty-state>
        </div>
        <div slot="content">
          <ul id="results" class="divide-y divide-line"></ul>
        </div>
      </hq-state-view>
    </hq-card>
  </hq-page-shell>

  <hq-note-modal id="note-modal"></hq-note-modal>

  <script src="/vendor/marked.min.js"></script>
  <script type="module" src="index.js"></script>
</body>
</html>
