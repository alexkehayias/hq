<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <link href="/output.css" rel="stylesheet">
  <title>Metrics</title>
  <script src="/theme-init.js"></script>
</head>
<body>
  <hq-page-shell meta-title="Metrics" back-href="/" back-label="Home">
    <hq-card max-width="4xl">
      <div slot="header">
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Metrics</h1>
        <p class="mt-2 text-gray-600 dark:text-gray-400">View usage statistics and trends</p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <hq-select id="metricType" label="Metric" value="tokens">
          <option value="tokens" selected>Tokens</option>
          <option value="sessions">Sessions</option>
        </hq-select>
        <hq-select id="timeRange" label="Time Range" value="30">
          <option value="7">Last 7 days</option>
          <option value="14">Last 14 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="60">Last 60 days</option>
          <option value="90">Last 90 days</option>
        </hq-select>
      </div>

      <h2 class="text-lg font-semibold text-gray-900 dark:text-white mt-8 mb-4">Summary</h2>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <hq-stat-card id="totalTokensCard" label="Total Tokens" value="--"></hq-stat-card>
        <hq-stat-card id="avgTokensPerDayCard" label="Avg Tokens/Day" value="--"></hq-stat-card>
        <hq-stat-card id="estCostCard" label="Est. Cost" value="--"></hq-stat-card>
      </div>

      <div class="mt-8">
        <hq-state-view id="metrics-view" state="loading">
          <div slot="empty">
            <hq-empty-state icon="metrics" title="No metrics data available">
              No usage data in the selected time range.
            </hq-empty-state>
          </div>
          <div slot="error">
            <hq-empty-state icon="alert" title="Failed to load metrics">
              Something went wrong while fetching your metrics.
              <hq-button id="retryBtn" slot="action" variant="secondary">Retry</hq-button>
            </hq-empty-state>
          </div>
          <div slot="content">
            <div id="chart" class="w-full" style="height: 400px;"></div>
          </div>
        </hq-state-view>
      </div>

    </hq-card>
  </hq-page-shell>
  <script src="/vendor/echarts.simple.min.js"></script>
  <script type="module" src="index.js"></script>
</body>
</html>
