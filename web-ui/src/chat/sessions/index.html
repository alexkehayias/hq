<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#FAFBF8">
  <link href="/output.css" rel="stylesheet">
  <title>Chat Sessions</title>
  <script src="/theme-init.js"></script>
</head>
<body class="bg-canvas text-ink">
  <hq-page-shell meta-title="Chat Sessions" back-href="/" back-label="Home">
    <h1 class="text-2xl font-bold mb-6 text-ink">Chat Sessions</h1>

    <hq-state-view id="sessions-view" state="loading">
      <div slot="empty">
        <hq-empty-state icon="sessions" title="No chat sessions found">
          Start a conversation and it will show up here.
        </hq-empty-state>
      </div>
      <div slot="error">
        <hq-empty-state icon="alert" title="Error loading chat sessions">
          Something went wrong while fetching your sessions. Please try again.
        </hq-empty-state>
      </div>
      <div slot="content">
        <div id="sessions-list" class="space-y-4"></div>
        <hq-pagination id="sessions-pagination" page="1" total-pages="1"></hq-pagination>
      </div>
    </hq-state-view>

  </hq-page-shell>
  <script type="module" src="index.js"></script>
</body>
</html>
