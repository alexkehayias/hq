<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FAFBF8">
    <link href="/output.css" rel="stylesheet">
    <link href="/vendor/codemirror/codemirror.min.css" rel="stylesheet">
    <link href="/vendor/codemirror/theme/dracula.min.css" rel="stylesheet" id="cm-theme">
    <title>Skills</title>
    <script src="/theme-init.js"></script>
    <script type="module" src="/components/index.js"></script>
  </head>
  <body class="bg-canvas text-ink">
    <hq-page-shell id="page-shell" meta-title="Skills" nav-rail="skills" back-href="/" back-label="Home">

      <!-- ===== List View (no ?name=) ===== -->
      <div id="list-view">
        <div class="mx-auto w-full max-w-[1000px]">
          <header class="mb-6">
            <h1 class="text-3xl font-bold text-ink">Skills</h1>
            <p class="mt-2 text-muted">Browse and edit available skills</p>
          </header>

          <hq-state-view id="list-view-state" state="loading">
            <div slot="empty">
              <hq-empty-state icon="skills" title="No skills available">
                Skills you install will show up here.
              </hq-empty-state>
            </div>
            <div slot="error">
              <hq-empty-state icon="alert" title="Failed to load skills">
                <span id="list-error-msg">Failed to load skills</span>
                <hq-button id="list-retry" slot="action" variant="secondary">Retry</hq-button>
              </hq-empty-state>
            </div>
            <div slot="content">
              <div id="skill-grid" class="grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3"></div>
            </div>
          </hq-state-view>
        </div>
      </div>

      <!-- ===== Detail View (?name=xxx) ===== -->
      <div id="detail-view" class="hidden">
        <hq-state-view id="detail-view-state" state="loading">
          <div slot="error">
            <hq-empty-state icon="alert" title="Failed to load skill">
              <span id="detail-error-msg"></span>
            </hq-empty-state>
          </div>
          <div slot="content">
            <hq-card max-width="6xl">
              <div slot="header">
                <div class="flex items-start justify-between flex-wrap gap-4">
                  <div>
                    <h1 id="skill-name" class="text-2xl font-bold text-ink"></h1>
                    <p id="skill-description" class="mt-1 text-muted"></p>
                  </div>
                  <div id="skill-badges" class="flex flex-wrap gap-2"></div>
                </div>
              </div>
              <div id="detail-body" class="flex flex-col">
                <div class="flex flex-col lg:flex-row -mx-6">
                  <!-- File Tree Sidebar -->
                  <div class="w-full lg:w-64 bg-mist lg:border-r border-line overflow-y-auto">
                    <div class="px-4 py-3 border-b border-line">
                      <h2 class="text-sm font-semibold text-body uppercase tracking-wider">Files</h2>
                    </div>
                    <div class="p-2">
                      <hq-file-tree id="file-tree"></hq-file-tree>
                    </div>
                  </div>
                  <!-- Editor -->
                  <div class="flex-1 flex flex-col min-w-0 border-t lg:border-t-0 border-line">
                    <hq-code-editor id="code-editor"></hq-code-editor>
                  </div>
                </div>
              </div>
            </hq-card>
          </div>
        </hq-state-view>
      </div>

    </hq-page-shell>

    <script src="/vendor/codemirror/codemirror.min.js"></script>
    <script src="/vendor/codemirror/mode/markdown.min.js"></script>
    <script src="/vendor/codemirror/mode/javascript.min.js"></script>
    <script src="/vendor/codemirror/mode/python.min.js"></script>
    <script src="/vendor/codemirror/mode/shell.min.js"></script>
    <script src="/vendor/codemirror/mode/yaml.min.js"></script>
    <script src="/vendor/codemirror/mode/xml.min.js"></script>
    <script type="module" src="index.js"></script>
  </body>
</html>
