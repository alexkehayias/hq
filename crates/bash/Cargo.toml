[package]
name = "hq-bash"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
async-trait = "0.1.92"
base64 = "0.22.1"
bigdecimal = "0.4"
bitflags = "2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
fancy-regex = "0.18"
futures-util = "0.3.32"
getrandom = "0.4"
hmac = "0.13"
md-5 = "0.11"
num-traits = "0.2"
os_display = "0.1.3"
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "fs", "net", "signal", "sync", "time"] }
unit-prefix = "0.5"
url = "2"

[dev-dependencies]
serial_test = "3.5.0"
tempfile = "3.27.0"
