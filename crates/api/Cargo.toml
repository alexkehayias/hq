[package]
name = "hq-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
hq = { path = "../.." }
hq-bash = { path = "../bash" }
anyhow = "1.0.103"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.6", features = ["query"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.32"
http = "1.4.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "fs", "net", "signal", "sync", "time"] }
tokio-rusqlite = { version = "0.8.0", features = ["bundled", "load_extension"] }
tokio-stream = "0.1.18"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v4"] }

# Prod-only: embed web-ui assets into the binary (enabled via `--features embed-assets`)
include_dir = { version = "0.7", optional = true }
mime_guess = { version = "2", optional = true }

[features]
embed-assets = ["dep:include_dir", "dep:mime_guess"]
