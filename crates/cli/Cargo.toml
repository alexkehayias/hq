[package]
name = "hq-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[[bin]]
name = "hq"
path = "src/main.rs"

[dependencies]
hq = { path = "../.." }
hq-api = { path = "../api" }
hq-bash = { path = "../bash" }
anyhow = "1.0.103"
async-stream = "0.3.6"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
http = "1.4.2"
libc = "0.2"
orgize = "0.10.0-alpha.10"
rustyline = "18.0.1"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "process", "io-std", "io-util", "fs", "net", "signal", "sync", "time"] }
tokio-rusqlite = { version = "0.8.0", features = ["bundled", "load_extension"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
uuid = { version = "1.23.4", features = ["v4"] }

[features]
embed-assets = ["hq-api/embed-assets"]

[dev-dependencies]
tempfile = "3.27.0"
