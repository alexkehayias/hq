name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    # build.rs compiles the Python sandbox component with componentize-py,
    # provisioned through the vendored uv. The committed bin/uv is macOS arm64,
    # so CI points HQ_UV at the Linux build. Keep the version in sync with the
    # Dockerfile.
    - name: Install uv
      id: setup-uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.13.5"
    - name: Run tests
      env:
        HQ_UV: ${{ steps.setup-uv.outputs.uv-path }}
      run: cargo test --workspace --locked
